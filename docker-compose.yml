services:
  mcp-server:
    container_name: mcp-gogs
    build:
      context: .
      args:
        GOGS_MCP_UID: ${GOGS_MCP_UID}
        GOGS_MCP_GID: ${GOGS_MCP_GID}
    restart: unless-stopped
    env_file: .env
    environment:
      - LOG_DIR=/app/logs
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
